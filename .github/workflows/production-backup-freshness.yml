name: Production Backup Freshness
# Missing-backup detection for the GitHub `schedule:` scheduler source. Reads only GitHub Actions run/job metadata
# with the read-only GITHUB_TOKEN (actions: read). It references no secret and no environment, and never touches
# Production, R2 or the database.
# A run only counts as a backup when its `Run production backup` STEP concluded success — a scheduled run that was
# skipped by the activation gate is overall "success" but made no backup and is NOT counted.
# It goes RED (GitHub's failed-workflow notification) when
#   - the backup workflow is not `active` (e.g. disabled_inactivity), or
#   - no run with a successful backup step was created in the last 100 minutes, or
#   - no such run created in UTC hour 09 (the daily-promotion hour of its scheduled_at = created_at) in the last 25 hours.
# Limits (not a guaranteed hourly RPO): GitHub may delay or drop scheduled runs, and THIS workflow is itself a scheduled
# workflow, so it stops with the 60-day auto-disable it reports — see docs/execution/p6/backup-github-schedule/OPERATING_GATE.md
# for the independent Owner operating control that must exist before acceptance.
# Inert unless vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE == GITHUB_SCHEDULE.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check scheduled backup freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FRESH_SOURCE: ${{ vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE }}
        run: |
          set -eu
          if [ "$FRESH_SOURCE" != "GITHUB_SCHEDULE" ]; then
            echo "GitHub schedule is not the selected scheduler source; nothing to check."
            exit 0
          fi
          state="$(gh api "repos/$REPO/actions/workflows/production-backup.yml" --jq .state)"
          if [ "$state" != "active" ]; then
            echo "::error::production-backup.yml is not active (state=$state); scheduled backups are NOT running."
            exit 1
          fi
          runs="$(gh run list --repo "$REPO" --workflow production-backup.yml --event schedule --status success --limit 40 --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"')"
          now="$(date -u +%s)"
          newest=0; daily=0
          while read -r id t; do
            [ -n "$id" ] || continue
            ok="$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[].steps[]? | select(.name == "Run production backup" and .conclusion == "success")] | length')"
            [ "$ok" -ge 1 ] || continue
            e="$(date -u -d "$t" +%s)"
            [ "$e" -gt "$newest" ] && newest="$e"
            if [ $(( now - e )) -le 90000 ] && [ "$(date -u -d "@$e" +%H)" = "09" ]; then daily=1; fi
          done <<EOF_RUNS
          $runs
          EOF_RUNS
          if [ "$newest" -eq 0 ] || [ $(( now - newest )) -gt 6000 ]; then
            echo "::error::No scheduled production backup with a successful backup step in the last 100 minutes."
            exit 1
          fi
          if [ "$daily" -ne 1 ]; then
            echo "::error::No successful backup created in UTC hour 09 within the last 25 hours; the daily copy may be missing."
            exit 1
          fi
          echo "Backup freshness OK."
