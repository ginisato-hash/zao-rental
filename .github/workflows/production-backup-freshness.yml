name: Production Backup Freshness
# Missing-backup detection for the GitHub `schedule:` scheduler source. Reads only GitHub Actions run metadata
# with the read-only GITHUB_TOKEN (actions: read). It references no secret, no environment and no repository
# variable other than the scheduler-source selector, and never touches Production, R2 or the database.
# It goes RED (GitHub's failed-workflow notification) when
#   - the backup workflow is not active (e.g. disabled_inactivity after 60 days without repository activity), or
#   - no successful scheduled backup run exists in the last 100 minutes, or
#   - no successful scheduled run happened in the 09:17-10:16 UTC window of the last 25 hours (daily promotion).
# Inert unless vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE == GITHUB_SCHEDULE.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check scheduled backup freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FRESH_SOURCE: ${{ vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE }}
        run: |
          set -eu
          if [ "$FRESH_SOURCE" != "GITHUB_SCHEDULE" ]; then
            echo "GitHub schedule is not the selected scheduler source; nothing to check."
            exit 0
          fi
          state="$(gh api "repos/$REPO/actions/workflows/production-backup.yml" --jq .state)"
          if [ "$state" != "active" ]; then
            echo "::error::production-backup.yml is not active (state=$state); scheduled backups are NOT running."
            exit 1
          fi
          runs="$(gh run list --repo "$REPO" --workflow production-backup.yml --event schedule --status success --limit 100 --json createdAt --jq '.[].createdAt')"
          now="$(date -u +%s)"
          newest=0; daily=0
          for t in $runs; do
            e="$(date -u -d "$t" +%s)"
            [ "$e" -gt "$newest" ] && newest="$e"
            age=$(( now - e ))
            hm="$(date -u -d "$t" +%H%M)"
            if [ "$age" -le 90000 ] && [ "$hm" -ge 0917 ] && [ "$hm" -le 1016 ]; then daily=1; fi
          done
          if [ "$newest" -eq 0 ] || [ $(( now - newest )) -gt 6000 ]; then
            echo "::error::No successful scheduled production backup in the last 100 minutes."
            exit 1
          fi
          if [ "$daily" -ne 1 ]; then
            echo "::error::No successful scheduled backup run in the 09:17-10:16 UTC window within the last 25 hours; the daily copy may be missing."
            exit 1
          fi
          echo "Backup freshness OK."
