name: Production Backup
# R2B mechanism only. This workflow is inert until a separate R4 authority sets
# the PRODUCTION_BACKUP_ACTIVATION repository/environment variable and injects
# the production-backup GitHub Environment secrets referenced below — none of
# which exist yet. A dispatch before that activation fails/skips before any
# Production secret is read.
#
# Scheduler source (exclusive): exactly ONE source may start backups.
#   - vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE unset / CLOUDFLARE_DISPATCH: the Cloudflare Worker dispatches
#     (workflow_dispatch); the GitHub `schedule:` trigger below is inert (skips before any secret).
#   - vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE = GITHUB_SCHEDULE: only the `schedule:` trigger runs; a
#     workflow_dispatch (e.g. from a revived Cloudflare Cron) is refused (red) before any secret, so a
#     slot can never be backed up twice by two sources.
# For `schedule:` the scheduled_at is the latest :17 UTC slot not after the runner clock (see the slot step);
# for dispatch it is the authoritative input sent by the Worker.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'Authoritative UTC scheduled-occurrence timestamp (ISO 8601, e.g. 2026-09-22T09:17:00.000Z), sent by the Cloudflare Worker scheduler. Object keys and daily-promotion classification derive from this, never the runner clock.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    # postgres:18 (18.6), resolved from registry-1.docker.io on 2026-09-21;
    # provides pinned PostgreSQL 18 pg_dump/pg_restore, not whatever happens
    # to be preinstalled on the runner.
    container:
      image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    steps:
      - name: Activation gate (must run before any secret is referenced)
        id: gate
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_REF: ${{ github.ref }}
          GATE_ACTIVATION: ${{ vars.PRODUCTION_BACKUP_ACTIVATION }}
          GATE_SOURCE: ${{ vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE }}
        run: |
          if [ "$GATE_REF" != "refs/heads/main" ]; then
            echo "::error::Production backup refused: ref is not refs/heads/main"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$GATE_ACTIVATION" != "R4_APPROVED" ]; then
            echo "Production backup activation gate not approved (PRODUCTION_BACKUP_ACTIVATION != R4_APPROVED)."
            echo "Skipping before any Production secret is accessed. This is expected until a separate R4 authority."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GATE_EVENT" in
            schedule)
              if [ "$GATE_SOURCE" != "GITHUB_SCHEDULE" ]; then
                echo "GitHub schedule is not the selected scheduler source (PRODUCTION_BACKUP_SCHEDULER_SOURCE != GITHUB_SCHEDULE); skipping before any secret."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            workflow_dispatch)
              if [ "$GATE_SOURCE" = "GITHUB_SCHEDULE" ]; then
                echo "::error::Dispatch refused: the scheduler source is GITHUB_SCHEDULE; a second source would back up the same slot twice."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            *)
              echo "::error::Production backup refused: unsupported event $GATE_EVENT"
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          echo "passed=true" >> "$GITHUB_OUTPUT"

      # Secret-free. dispatch: the Worker's authoritative input is passed through unchanged (scripts/production-backup.ts
      # validates it strictly). schedule: the latest hh:17:00.000Z UTC slot that is not after the runner clock. A delayed
      # run therefore still maps to the slot it was scheduled for (same deterministic R2 key on a retry of that slot);
      # only a delay of one hour or more maps to a later slot.
      - name: Resolve scheduled_at (secret-free)
        if: steps.gate.outputs.passed == 'true'
        id: slot
        env:
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_INPUT: ${{ inputs.scheduled_at }}
        run: |
          set -eu
          if [ "$SLOT_EVENT" = "schedule" ]; then
            now="$(date -u +%s)"
            slot=$(( now / 3600 * 3600 + 17 * 60 ))
            if [ "$slot" -gt "$now" ]; then slot=$(( slot - 3600 )); fi
            scheduled_at="$(date -u -d "@$slot" +%Y-%m-%dT%H:%M:%S.000Z)"
          else
            scheduled_at="$SLOT_INPUT"
          fi
          echo "scheduled_at=$scheduled_at" >> "$GITHUB_OUTPUT"
          echo "scheduled_at resolved: $scheduled_at"

      # The pinned postgres:18 image ships without the Debian CA bundle, but the backup's pg_dump verifies the server
      # (full verification, channel binding required) against exactly this root (EXPECTED_PRODUCTION_CA_ROOT in
      # scripts/production-backup.ts; no fallback path, no ambient root override, no downgrade). This step references no
      # secret and runs before any step that does.
      - name: Prepare CA root (secret-free)
        if: steps.gate.outputs.passed == 'true'
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          test -f /etc/ssl/certs/ca-certificates.crt
          test ! -L /etc/ssl/certs/ca-certificates.crt
          test -r /etc/ssl/certs/ca-certificates.crt
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        if: steps.gate.outputs.passed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.gate.outputs.passed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        if: steps.gate.outputs.passed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run production backup
        if: steps.gate.outputs.passed == 'true'
        env:
          BACKUP_MODE: production
          BACKUP_CLASS: hourly
          SCHEDULED_AT: ${{ steps.slot.outputs.scheduled_at }}
          PRODUCTION_BACKUP_ACTIVATION: ${{ vars.PRODUCTION_BACKUP_ACTIVATION }}
          PRODUCTION_BACKUP_BUCKET: ${{ vars.PRODUCTION_BACKUP_BUCKET }}
          AGE_BACKUP_RECIPIENT: ${{ vars.AGE_BACKUP_RECIPIENT }}
          PGHOST: ${{ secrets.PRODUCTION_BACKUP_PGHOST }}
          PGPORT: ${{ secrets.PRODUCTION_BACKUP_PGPORT }}
          PGDATABASE: ${{ secrets.PRODUCTION_BACKUP_PGDATABASE }}
          PGUSER: ${{ secrets.PRODUCTION_BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.PRODUCTION_BACKUP_PGPASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.PRODUCTION_BACKUP_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_BACKUP_R2_SECRET_ACCESS_KEY }}
        run: npm run backup:production
