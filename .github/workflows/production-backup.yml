name: Production Backup
# R2B mechanism only. This workflow is inert until a separate R4 authority sets
# the PRODUCTION_BACKUP_ACTIVATION repository/environment variable and injects
# the production-backup GitHub Environment secrets referenced below — none of
# which exist yet. A dispatch before that activation fails/skips before any
# Production secret is read.
#
# Scheduler source (exclusive, fail closed): vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE must be set EXPLICITLY.
#   - CLOUDFLARE_DISPATCH: only the Cloudflare Worker's workflow_dispatch runs; the `schedule:` trigger is inert.
#   - GITHUB_SCHEDULE:     only the `schedule:` trigger runs; a workflow_dispatch is refused (red).
#   - unset / any other value: every event is refused (red) before any secret. Selecting the source is a separate,
#     approved release step — there is no implicit default.
# scheduled_at: dispatch = the Worker's authoritative input, unchanged. schedule = the run's immutable GitHub
# `created_at`, used AS-IS (to the second) — a best-effort GitHub-side effective timestamp, NOT GitHub's intended
# scheduled occurrence (GitHub does not expose it) and NOT the moment the dump is taken. No :17 occurrence is invented,
# so a delayed event is never mapped to another hour's slot. Re-runs keep the same created_at (same R2 key); two runs
# always have distinct created_at (distinct keys). A run whose job starts more than 30 minutes after its created_at
# (long queue, or a re-run much later) is refused rather than labelled with a stale time; the next scheduled run covers.
# The daily promotion (UTC hour 9 of scheduled_at) therefore follows the creation time: a 09:17 event created at 10:18
# is NOT promoted. The selector variable is read at repository level by the `selector` job and by the gate (environment
# resolution); the gate fails closed unless both see the same value.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: 'Authoritative UTC scheduled-occurrence timestamp (ISO 8601, e.g. 2026-09-22T09:17:00.000Z), sent by the Cloudflare Worker scheduler. Object keys and daily-promotion classification derive from this, never the runner clock.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  # Repository-level view of the selector (no environment). The backup gate must see the same value.
  selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      source: ${{ steps.sel.outputs.source }}
    steps:
      - id: sel
        env:
          SEL_SOURCE: ${{ vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE }}
        run: echo "source=$SEL_SOURCE" >> "$GITHUB_OUTPUT"

  # Secret-free, no checkout. Only reads this run's own metadata (actions: read); the backup job's permissions are unchanged.
  slot:
    needs: selector
    if: github.event_name == 'workflow_dispatch' || needs.selector.outputs.source == 'GITHUB_SCHEDULE'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scheduled_at: ${{ steps.slot.outputs.scheduled_at }}
    steps:
      - name: Resolve scheduled_at (secret-free)
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_INPUT: ${{ inputs.scheduled_at }}
          SLOT_REPO: ${{ github.repository }}
          SLOT_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          if [ "$SLOT_EVENT" = "schedule" ]; then
            created="$(gh api "repos/$SLOT_REPO/actions/runs/$SLOT_RUN_ID" --jq .created_at)"
            case "$created" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z) ;;
              *) echo "::error::Run created_at is missing or malformed; refusing."; exit 1 ;;
            esac
            at="$(date -u -d "$created" +%s)"
            now="$(date -u +%s)"
            if [ "$at" -gt $(( now + 300 )) ] || [ $(( now - at )) -gt 1800 ]; then
              echo "::error::Run created_at is $(( now - at ))s old (allowed: -300s..1800s); refusing to label a backup with a stale or future time."
              exit 1
            fi
            scheduled_at="$(date -u -d "@$at" +%Y-%m-%dT%H:%M:%S.000Z)"
          else
            scheduled_at="$SLOT_INPUT"
          fi
          echo "scheduled_at=$scheduled_at" >> "$GITHUB_OUTPUT"
          echo "scheduled_at resolved: $scheduled_at"

  backup:
    needs: [selector, slot]
    # slot is skipped when the selected source is not GitHub (a skipped need must not skip the gate); a failed slot does.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    # postgres:18 (18.6), resolved from registry-1.docker.io on 2026-09-21;
    # provides pinned PostgreSQL 18 pg_dump/pg_restore, not whatever happens
    # to be preinstalled on the runner.
    container:
      image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    steps:
      - name: Activation gate (must run before any secret is referenced)
        id: gate
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_REF: ${{ github.ref }}
          GATE_ACTIVATION: ${{ vars.PRODUCTION_BACKUP_ACTIVATION }}
          GATE_SOURCE: ${{ vars.PRODUCTION_BACKUP_SCHEDULER_SOURCE }}
          GATE_REPO_SOURCE: ${{ needs.selector.outputs.source }}
        run: |
          if [ "$GATE_REF" != "refs/heads/main" ]; then
            echo "::error::Production backup refused: ref is not refs/heads/main"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$GATE_ACTIVATION" != "R4_APPROVED" ]; then
            echo "Production backup activation gate not approved (PRODUCTION_BACKUP_ACTIVATION != R4_APPROVED)."
            echo "Skipping before any Production secret is accessed. This is expected until a separate R4 authority."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GATE_SOURCE" != "$GATE_REPO_SOURCE" ]; then
            echo "::error::Scheduler source differs between repository and environment scope; refusing before any secret (the variable must exist at repository level only)."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          case "$GATE_SOURCE" in
            CLOUDFLARE_DISPATCH|GITHUB_SCHEDULE) ;;
            *)
              echo "::error::Scheduler source is not explicitly selected (PRODUCTION_BACKUP_SCHEDULER_SOURCE must be CLOUDFLARE_DISPATCH or GITHUB_SCHEDULE); refusing before any secret."
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          case "$GATE_EVENT" in
            schedule)
              if [ "$GATE_SOURCE" != "GITHUB_SCHEDULE" ]; then
                echo "GitHub schedule is not the selected scheduler source; skipping before any secret."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            workflow_dispatch)
              if [ "$GATE_SOURCE" != "CLOUDFLARE_DISPATCH" ]; then
                echo "::error::Dispatch refused: the scheduler source is $GATE_SOURCE; a second source would back up the same slot twice."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              ;;
            *)
              echo "::error::Production backup refused: unsupported event $GATE_EVENT"
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          echo "passed=true" >> "$GITHUB_OUTPUT"

      # The pinned postgres:18 image ships without the Debian CA bundle, but the backup's pg_dump verifies the server
      # (full verification, channel binding required) against exactly this root (EXPECTED_PRODUCTION_CA_ROOT in
      # scripts/production-backup.ts; no fallback path, no ambient root override, no downgrade). This step references no
      # secret and runs before any step that does.
      - name: Prepare CA root (secret-free)
        if: steps.gate.outputs.passed == 'true'
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          test -f /etc/ssl/certs/ca-certificates.crt
          test ! -L /etc/ssl/certs/ca-certificates.crt
          test -r /etc/ssl/certs/ca-certificates.crt
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        if: steps.gate.outputs.passed == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.gate.outputs.passed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream
        with:
          node-version: '24.15.0'

      - name: Install dependencies
        if: steps.gate.outputs.passed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run production backup
        if: steps.gate.outputs.passed == 'true'
        env:
          BACKUP_MODE: production
          BACKUP_CLASS: hourly
          SCHEDULED_AT: ${{ needs.slot.outputs.scheduled_at }}
          PRODUCTION_BACKUP_ACTIVATION: ${{ vars.PRODUCTION_BACKUP_ACTIVATION }}
          PRODUCTION_BACKUP_BUCKET: ${{ vars.PRODUCTION_BACKUP_BUCKET }}
          AGE_BACKUP_RECIPIENT: ${{ vars.AGE_BACKUP_RECIPIENT }}
          PGHOST: ${{ secrets.PRODUCTION_BACKUP_PGHOST }}
          PGPORT: ${{ secrets.PRODUCTION_BACKUP_PGPORT }}
          PGDATABASE: ${{ secrets.PRODUCTION_BACKUP_PGDATABASE }}
          PGUSER: ${{ secrets.PRODUCTION_BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.PRODUCTION_BACKUP_PGPASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.PRODUCTION_BACKUP_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_BACKUP_R2_SECRET_ACCESS_KEY }}
        run: npm run backup:production
