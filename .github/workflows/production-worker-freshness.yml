name: Production Worker Freshness
# Independent outside check of the Production worker (Vercel cron /api/internal/worker-tick, every minute). Reads the
# last 15 minutes of Production runtime logs for the tick lines and judges them with scripts/production-worker-freshness.ts
# (no COMPLETED tick within 300 s, dormant while expected active, 3 consecutive non-success ticks, oldest pending
# payment older than 900 s). It goes RED (GitHub's failed-workflow e-mail) on ALERT and also when the logs cannot be
# read or the judgement is missing, so a broken monitor is never silent.
# Reads only. The Vercel CLI comes from the lockfile in tools/vercel-cli, installed with --ignore-scripts in a step that
# has no token; the single secret VERCEL_MONITOR_TOKEN (environment production-monitor, main only) is passed to the
# `vercel logs` command alone. No deploy, env, DB, R2 or provider call.
# vars.PRODUCTION_WORKER_MONITOR_MODE=INTENTIONAL_STOP reports with a warning, without alerting, during a planned stop.
# Like every scheduled workflow, GitHub disables it after 60 days without repository activity.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-monitor
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified upstream
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install (no token present)
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix tools/vercel-cli
      - name: Check Production worker freshness
        env:
          MONITOR_TOKEN: ${{ secrets.VERCEL_MONITOR_TOKEN }}
          MONITOR_MODE: ${{ vars.PRODUCTION_WORKER_MONITOR_MODE }}
          VERCEL_BIN: tools/vercel-cli/node_modules/.bin/vercel
        run: |
          set -euo pipefail
          if [ -z "$MONITOR_TOKEN" ]; then echo "::error::VERCEL_MONITOR_TOKEN is not set; the worker is NOT monitored."; exit 1; fi
          out="$(mktemp -d)"
          mode=--expected-active
          if [ "$MONITOR_MODE" = "INTENTIONAL_STOP" ]; then
            mode=--intentional-stop
            echo "::warning::PRODUCTION_WORKER_MONITOR_MODE=INTENTIONAL_STOP; worker staleness is NOT alerting. Unset it when the planned stop ends."
          fi
          VERCEL_TOKEN="$MONITOR_TOKEN" "$VERCEL_BIN" logs --project prj_ehUMOzM77em9DVnHJBJffncD5hg7 --scope zao-food-map \
            --environment production --since 15m --json --limit 100 --query normal_worker_tick > "$out/ticks.jsonl" \
            || { echo "::error::Production runtime logs could not be read; the worker is NOT monitored."; exit 1; }
          unset MONITOR_TOKEN
          node --import tsx scripts/production-worker-freshness.ts "$mode" < "$out/ticks.jsonl" | tee "$out/result.json" \
            || { echo "::error::Production worker freshness ALERT (see result above)."; exit 1; }
          grep -Eq '"status":"(OK|NOT_EXPECTED)"' "$out/result.json" \
            || { echo "::error::No freshness judgement was produced; the worker is NOT monitored."; exit 1; }
