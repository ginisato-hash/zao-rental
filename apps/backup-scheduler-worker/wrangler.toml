# Production backup scheduler. The Cron Trigger below is the ONLY trigger; this Worker has no
# fetch handler (see src/index.ts), no route, no binding and no plaintext variable.
# Activation (`wrangler deploy` + the secret below) is a separate Owner-attended step from the
# exact accepted main; nothing is deployed from an uncommitted config.
name = "zao-rental-production-backup-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-21"

# Dispatches the Production backup workflow once per hour at :17 UTC.
[triggers]
crons = ["17 * * * *"]

# Worker secret (never in this file or in source; set by the Owner at activation):
#   wrangler secret put GITHUB_ACTIONS_DISPATCH_TOKEN
# Fine-grained GitHub token: this exact repository only, Actions:write, no
# Contents write, no Administration, no Secrets write, no org-wide scope.
